<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Badminton Paris — Créneaux Sport Proximité</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0dc;
    --cream-dim: #ece5c8;
    --navy: #1d2b4f;
    --navy-soft: #2e3f6b;
    --court-blue: #4a7fc4;
    --court-blue-dark: #33588f;
    --lime: #c9d357;
    --lime-dark: #96a02c;
    --dusty-pink: #e6a3ac;
    --white: #ffffff;
    --muted: #6b6a58;
    --ink: var(--navy);
    --court-green: var(--court-blue);
    --court-green-dark: var(--navy);
    --line-white: var(--white);
    --shuttle: var(--lime-dark);
    --shuttle-dark: var(--navy);
    --paper: var(--cream);
    --paper-dim: var(--cream-dim);
    --line: var(--navy);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    height: 100%;
    margin: 0;
    background: var(--navy);
  }
  body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Space Mono", "SF Mono", Menlo, monospace;
    background: var(--paper);
    color: var(--ink);
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--navy);
    color: var(--cream);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 600;
    overflow: hidden;
    border-bottom: 4px solid var(--navy);
    box-shadow: 0 4px 0 var(--court-blue);
  }
  .court-lines {
    position: absolute;
    right: 15px; top: 8px; bottom: -22px;
    width: 600px;
    opacity: 0.28;
    pointer-events: none;
  }
  .court-lines svg { width: 100%; height: 100%; }
  .header-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .shuttle-icon {
    width: 26px;
    height: auto;
    flex-shrink: 0;
  }
  h1 {
    margin: 0;
    font-family: "Silkscreen", "Space Mono", monospace;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.3;
    text-shadow: 2px 2px 0 var(--navy-soft);
  }
  h1 .accent { color: var(--lime); }

  /* ---------- Filter bar ---------- */
  #filterbar {
    background: var(--paper);
    border-top: 3px solid var(--navy);
    box-shadow: 0 -3px 0 rgba(29,43,79,0.08);
    padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 500;
  }

  .row-label {
    font-family: "Silkscreen", monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--navy);
    font-weight: 700;
    padding-left: 2px;
    margin-bottom: 5px;
  }

  #dayscroll, #periodscroll {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  #dayscroll::-webkit-scrollbar, #periodscroll::-webkit-scrollbar { display: none; }

  .day-chip {
    flex: 0 0 auto;
    padding: 7px 13px;
    border-radius: 999px;
    border: 2px solid var(--navy);
    background: var(--white);
    box-shadow: 2px 2px 0 var(--navy);
    font-size: 12px;
    font-weight: 700;
    color: var(--navy);
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .day-chip:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--navy);
  }
  .day-chip.active {
    background: var(--court-blue);
    border-color: var(--navy);
    color: var(--white);
  }

  /* ---------- Map ---------- */
  #map {
    flex: 1 1 auto;
    min-height: 300px;
    width: 100%;
    background: var(--paper-dim);
    position: relative;
  }
  #map .leaflet-tile-pane {
    filter: saturate(0.35) brightness(1.05) contrast(1.05);
  }

  .leaflet-popup-content-wrapper {
    border-radius: 0;
    border: 3px solid var(--navy);
    box-shadow: 4px 4px 0 var(--navy);
    padding: 0;
    overflow: hidden;
  }
  .leaflet-popup-content {
    margin: 0;
    width: 260px !important;
  }
  .leaflet-popup-tip {
    background: var(--navy);
    border-radius: 0;
  }
  .leaflet-popup-close-button {
    color: var(--cream) !important;
    font-size: 18px !important;
    font-family: "Space Mono", monospace !important;
  }

  .popup-head {
    background: var(--navy);
    color: var(--cream);
    padding: 12px 14px 10px;
    border-bottom: 3px solid var(--court-blue);
  }
  .popup-head .arr {
    font-family: "Silkscreen", monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--lime);
    text-transform: uppercase;
  }
  .popup-head h3 {
    margin: 5px 0 0;
    font-size: 14.5px;
    line-height: 1.3;
    font-weight: 700;
    font-family: "Space Mono", monospace;
  }
  .popup-head .addr {
    margin: 5px 0 0;
    font-size: 11.5px;
    color: var(--cream);
    opacity: 0.75;
    line-height: 1.4;
  }

  .popup-body {
    padding: 12px 14px 14px;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .slot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 9px;
    border: 1.5px solid var(--navy);
    background: var(--white);
    font-size: 12.5px;
  }
  .slot .day {
    font-weight: 700;
    color: var(--navy);
  }
  .slot .time {
    font-variant-numeric: tabular-nums;
    color: var(--court-blue-dark);
    font-weight: 700;
  }
  .slot .note {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
  }
  .no-slot {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    padding: 4px 2px;
  }
  .gmaps-link {
    display: inline-block;
    margin-top: 4px;
    padding: 6px 10px;
    border: 2px solid var(--navy);
    background: var(--lime);
    box-shadow: 2px 2px 0 var(--navy);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--navy);
    text-decoration: none;
    text-align: center;
  }

  /* custom marker - pixel-art assumé */
  .bmk-marker {
    width: 30px; height: 30px;
    background: var(--navy);
    border: 3px solid var(--cream);
    box-shadow: 3px 3px 0 var(--navy);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: opacity 0.15s;
  }
  .bmk-marker.unmatched {
    opacity: 0.35;
  }
  .bmk-marker img {
    width: 18px !important;
    height: 18px !important;
    max-width: 18px;
    max-height: 18px;
    object-fit: contain;
    display: block;
  }

  .leaflet-control-attribution {
    font-size: 9px !important;
  }

  .leaflet-control-zoom {
    border: 2px solid var(--navy) !important;
    box-shadow: 3px 3px 0 var(--navy) !important;
    border-radius: 0 !important;
  }
  .leaflet-control-zoom a {
    background: var(--white) !important;
    color: var(--navy) !important;
    border-radius: 0 !important;
    font-family: "Space Mono", monospace !important;
    font-weight: 700 !important;
  }
  .leaflet-control-zoom a:hover {
    background: var(--cream-dim) !important;
  }
</style>
</head>

// ============ STATE ============
let activeDay = "Tous";
let activePeriod = "Tous";
let map, markersLayer;

const JOURS_ORDRE = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

// Bornes des périodes (en minutes depuis minuit)
const PERIODES = {
  "Matin":       { start: 0,    end: 12*60 },
  "Midi":        { start: 12*60, end: 14*60 },
  "Après-midi":  { start: 14*60, end: 18*60 },
  "Soir":        { start: 18*60, end: 24*60 }
};

function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

// Un créneau matche une période s'il la chevauche (même partiellement)
function slotMatchesPeriod(slot, periodName) {
  if (periodName === "Tous") return true;
  const p = PERIODES[periodName];
  const s = timeToMinutes(slot.debut);
  const e = timeToMinutes(slot.fin);
  return s < p.end && e > p.start;
}

function slotMatchesFilters(slot) {
  if (activeDay !== "Tous" && slot.jour !== activeDay) return false;
  if (!slotMatchesPeriod(slot, activePeriod)) return false;
  return true;
}

function gymHasMatchingSlot(gym) {
  return gym.creneaux.some(slotMatchesFilters);
}

// ============ MAP INIT ============
function initMap() {
  map = L.map('map', {
    zoomControl: false,
    attributionControl: true
  }).setView([48.8636, 2.345], 12);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    subdomains: 'abc',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  render();

  // Recalcule la taille de la carte : nécessaire dans certains webviews
  // (ex. viewer d'artefact) où le conteneur n'a pas sa taille finale au chargement.
  setTimeout(() => map.invalidateSize(), 100);
  setTimeout(() => map.invalidateSize(), 500);
  window.addEventListener('resize', () => map.invalidateSize());
  window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 200));
}

const SHUTTLE_IMG_TAG = `<img src="data:image/png;base64,${SHUTTLE_IMG_B64}" alt="">`;

function makeIcon(unmatched) {
  const cls = unmatched === true ? 'bmk-marker unmatched' : 'bmk-marker';
  return L.divIcon({
    className: '',
    html: `<div class="${cls}">${SHUTTLE_IMG_TAG}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 28],
    popupAnchor: [0, -26]
  });
}

function buildPopupHTML(gym) {
  const sortedSlots = [...gym.creneaux].sort((a,b) => {
    const di = JOURS_ORDRE.indexOf(a.jour) - JOURS_ORDRE.indexOf(b.jour);
    if (di !== 0) return di;
    return timeToMinutes(a.debut) - timeToMinutes(b.debut);
  });

  const visibleSlots = sortedSlots.filter(slotMatchesFilters);
  const isFiltering = activeDay !== "Tous" || activePeriod !== "Tous";
  const slotsToShow = isFiltering ? visibleSlots : sortedSlots;

  let slotsHTML = "";
  if (slotsToShow.length === 0) {
    slotsHTML = `<div class="no-slot">Aucun créneau ne correspond au filtre.</div>`;
  } else {
    slotsHTML = slotsToShow.map(s => {
      return `<div class="slot">
        <div>
          <span class="day">${s.jour}</span>
          ${s.note ? `<span class="note">${s.note}</span>` : ''}
        </div>
        <div class="time">${s.debut}–${s.fin}</div>
      </div>`;
    }).join("");
  }

  const gmapsQuery = encodeURIComponent(gym.nom + ", " + gym.adresse);

  return `
    <div class="popup-head">
      <div class="arr">${gym.arr}${gym.arr === 1 ? 'er' : 'e'} arrondissement</div>
      <h3>${gym.nom}</h3>
      <p class="addr">${gym.adresse}</p>
    </div>
    <div class="popup-body">
      ${slotsHTML}
      <a class="gmaps-link" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${gmapsQuery}">Ouvrir dans Maps →</a>
    </div>
  `;
}

function render() {
  markersLayer.clearLayers();
  const isFiltering = activeDay !== "Tous" || activePeriod !== "Tous";

  GYMS.forEach(gym => {
    const matches = gymHasMatchingSlot(gym);
    const isUnmatched = isFiltering && !matches;
    const marker = L.marker([gym.lat, gym.lng], {
      icon: makeIcon(isUnmatched),
      zIndexOffset: isUnmatched ? 0 : 1000
    });
    marker.bindPopup(buildPopupHTML(gym));
    marker.addTo(markersLayer);
  });
}

// ============ FILTER UI ============
document.querySelectorAll('#dayscroll .day-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const alreadyActive = chip.classList.contains('active');
    document.querySelectorAll('#dayscroll .day-chip').forEach(c => c.classList.remove('active'));
    if (alreadyActive) {
      activeDay = "Tous";
    } else {
      chip.classList.add('active');
      activeDay = chip.dataset.day;
    }
    render();
  });
});

document.querySelectorAll('#periodscroll .day-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const alreadyActive = chip.classList.contains('active');
    document.querySelectorAll('#periodscroll .day-chip').forEach(c => c.classList.remove('active'));
    if (alreadyActive) {
      activePeriod = "Tous";
    } else {
      chip.classList.add('active');
      activePeriod = chip.dataset.period;
    }
    render();
  });
});

initMap();
</script>
